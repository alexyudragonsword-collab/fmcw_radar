# 60 GHz sensing radar with the subtractive TDC dither on: the same radar as radar_60g_sensing.yaml,
# its chirp generator's TDC dithered by 1 LSB (a known pseudo-random offset injected at the TDC -- a DTC
# on the reference path -- and taken out again digitally; pll_simulator#80).  The sensing config leaves
# it off because no source says the 60 GHz ADPLL whose TDC resolution it reads has one; there the TDC's
# quantisation repeats ramp after ramp and a frame integrates it into ghost targets (2.75 detections a
# frame).  With 1 LSB the ghosts are gone and the phase-noise level is the same.  The LO parked between
# ramps wants 3 LSB before the linear profile holds for it too (cairn/chirp-engine.md).
schema_version: 1
band:
  kind: 60g_sensing
  center_hz: 60.0e9
  sweep_hz: 4.0e9
chirp:
  shape: sawtooth
  duration_s: 100.0e-6
  idle_s: 0.0
  n_chirps: 64
lo:
  fref_hz: 100.0e6
  loop_bw_hz: 1.0e6
  phase_margin_deg: 60.0
  kdco_hz: 50.0e3
  dp_gain: 1.0
  dp_cal: offline
  dp_cal_iterations: 2
  engine: event
  tdc_dither_lsb: 1.0
frontend: {}
channel:
  extra_loss_db: 0.0
target:
  kind: human
  range_m: 5.0
  velocity_mps: 2.0
rx:
  if_bw_hz: 4.0e6
  adc_fs_hz: 10.0e6
  adc_bits: 12
  adc_fullscale_dbm: 4.0
processing:
  window_range: hann
  window_doppler: hann
  range_pad: 4
  doppler_pad: 1
  cfar_guard: 2
  cfar_train: 8
  cfar_pfa: 1.0e-4
sim:
  seed: 1
  engine: statistical
  time_osr: 1.25
