name: ci

# lint + tests (four Pythons and the declared dependency floor) + every example
# at smoke size + vendor drift against the pinned polar_tx + the numerical
# fingerprint, on every push / PR (d2d_link's workflow, re-homed).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # each push gets a group of its own (its fingerprint job judges the commits
  # it brought); pull requests share one per ref and cancel the superseded run
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "ruff>=0.4"
      - run: ruff check src/ tests/ examples/ tools/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[plot,test]"
      - name: Tests
        run: pytest -q

  # The declared minimums, not the newest: pyproject promises numpy>=1.26,
  # scipy>=1.11, pyyaml>=6.0, and nothing else ever runs at those versions.
  test-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install the declared minimums
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.26.*" "scipy==1.11.*" "pyyaml==6.0.*" "pytest>=7" "ruff>=0.4"
          pip install --no-deps -e .
      - name: Tests at the floor (no plots)
        run: pytest -q

  examples:
    # Every example end to end with n_chirps capped (tools/run_examples.py
    # --smoke): catches the run-time drift test_examples.py cannot see --
    # renamed config fields, result keys, shapes -- not the numbers, which
    # tools/example_drift.py compares against examples/expected/.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[plot,test]"
      - name: Run every example (smoke size)
        run: python tools/run_examples.py --smoke

  # Invariant #7: a change that is not meant to move a number must not move
  # one. The base and the head are fingerprinted on the same runner and
  # compared; the escape hatch is "(numbers-move" in the message of a commit
  # the push brings (or the PR label numbers-move).
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[plot,test]"
      - name: Record the head
        run: python tools/fingerprint.py record head.json
      - name: Pick the base
        id: base
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sha="${{ github.event.pull_request.base.sha }}"
          elif [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
            sha="$before"
          else
            git fetch --no-tags origin main >/dev/null 2>&1 || true
            sha="$(git merge-base HEAD origin/main 2>/dev/null || true)"
            # --verify -q: a plain rev-parse echoes an unknown "HEAD^" to stdout on a one-commit history
            if [ "$sha" = "$(git rev-parse HEAD)" ] || [ -z "$sha" ]; then sha="$(git rev-parse --verify -q HEAD^ || true)"; fi
            echo "::notice::no previous head for this push; comparing with ${sha:-nothing}"
          fi
          if [ -z "$sha" ]; then echo "::notice::no base to compare the fingerprint with (first commit)"; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Record the base
        if: steps.base.outputs.sha != ''
        run: |
          git worktree add ../base ${{ steps.base.outputs.sha }}
          pip install --no-deps -e ../base
          (cd ../base && python tools/fingerprint.py record "$GITHUB_WORKSPACE/base.json")
          pip install --no-deps -e .
      - name: Compare
        if: steps.base.outputs.sha != ''
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          python tools/fingerprint.py compare base.json head.json > diff.txt || true
          cat diff.txt
          if grep -q "values differ" diff.txt; then
            if echo "$PR_LABELS" | grep -q numbers-move || git log --format=%B "$BASE"..HEAD | grep -q "(numbers-move"; then
              echo "numbers moved and the change says so"
            else
              echo "::error::numbers moved without a (numbers-move: why) marker"; exit 1
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fingerprint
          path: |
            head.json
            base.json
            diff.txt
          if-no-files-found: ignore
          retention-days: 30

  # Vendor drift: src/fmcw_radar/vendor must still match the pinned polar_tx,
  # array_tx, mmw60_trx and spec_sources commits (polar_tx's vendor_check method).  The sibling is checked out at
  # exactly the pinned SHA, so --strict (stale pins fail) is satisfiable here
  # and --fail-on-skip makes an unverified file red rather than a pass.
  vendor-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: fmcw_radar
      - name: Checkout polar_tx (pinned)
        uses: actions/checkout@v4
        with:
          repository: alexyudragonsword-collab/polar_tx
          ref: b007e60477bac68806138db733cbafd0c0761282
          path: _siblings/polar_tx
      - name: Checkout array_tx (pinned)
        uses: actions/checkout@v4
        with:
          repository: alexyudragonsword-collab/array_tx
          ref: e897c159e5fc5b2e26af6336cf9f6164461ff7f5
          path: _siblings/array_tx
      - name: Checkout mmw60_trx (pinned)
        uses: actions/checkout@v4
        with:
          repository: alexyudragonsword-collab/mmw60_trx
          ref: ef0f00c50c508271abdf1423fde7062ba0a0b92d
          path: _siblings/mmw60_trx
      - name: Checkout spec_sources (pinned)
        uses: actions/checkout@v4
        with:
          repository: alexyudragonsword-collab/spec_sources
          ref: f87cc9b54af9d6510e406d8356c04267fa1dd388
          path: _siblings/spec_sources
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vendor drift check
        working-directory: fmcw_radar
        run: >
          python tools/vendor_check.py --strict --fail-on-skip
          --siblings polar_tx=${{ github.workspace }}/_siblings/polar_tx
          array_tx=${{ github.workspace }}/_siblings/array_tx
          mmw60_trx=${{ github.workspace }}/_siblings/mmw60_trx
          spec_sources=${{ github.workspace }}/_siblings/spec_sources
