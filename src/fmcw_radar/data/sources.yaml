    cite: "47 CFR 15.255 'Operation within the band 57-71 GHz', eCFR current text (section last amended 2023-08-23); read in the original by spec_sources (2026-11-16 / 2026-11-18, spec_sources#50)"
    section: "§15.255(b)(3)；(c)(2) 首句"
    quote: "(2) Field disturbance sensors/radars shall not exceed −10 dBm peak conducted output power and 10 dBm peak EIRP except that field disturbance sensors/radars that limit their operation to all or part of the specified frequency band may operate without being subject to a transmitter conducted output power limit if they operate in compliance with paragraph (b)(3) of this section or with one or more of the provisions below:"
    note: "装在无人机上、工作频率限制在 60–64 GHz 之内(离地 ≤ 121.92 m,本库不建模高度):计入关断的最短连续时长;更短的空闲(chirp 之间的回扫)不算关断。"
