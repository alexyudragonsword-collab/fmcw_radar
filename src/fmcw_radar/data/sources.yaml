  # ---------------------------------------------------------------- 大气(survey)
  oxygen.60g_db_per_km:
    value: 14.651
    unit: dB/km
    source: derived
    upstream: "spec_sources:itu_p676.gamma_o_dry_sea_level#db_per_km@f_ghz=60"
    cite: "Recommendation ITU-R P.676-13 (08/2022), 'Attenuation by atmospheric gases and related effects', Annex 1 (line-by-line method); read in the original by spec_sources (2026-11-13)"
    note: "公式:γo = 0.1820·f·(Σ Si·Fi + N″D),原文 Annex 1 §1 式 (1)–(9),Table 1 的 44 条氧气谱线,图 1 的海平面干大气(1013.25 hPa、15 °C、水汽 0)逐线求和;由 spec_sources 算(itu_p676.gamma_o_dry_sea_level),本库用 Python 包 itur 0.4.0 独立复算一致。只算氧气(干空气),不含水汽:本库的 channel.oxygen_db_per_km 就是氧气。 60.0 GHz 处的值。**更正(0.2.11)**:0.2.10 及以前记 15.0(survey,转述),那是 60.81 GHz 处的峰值 15.06,不是频段中心;本库 58–62 GHz 的扫频内在 12.4 到 15.06 之间。往返 2R,10 m 处 0.147 dB。"
  oxygen.77g_db_per_km:
    value: 0.091
    unit: dB/km
    source: derived
    upstream: "spec_sources:itu_p676.gamma_o_dry_sea_level#db_per_km@f_ghz=77.5"
    cite: "Recommendation ITU-R P.676-13 (08/2022), 'Attenuation by atmospheric gases and related effects', Annex 1 (line-by-line method); read in the original by spec_sources (2026-11-13)"
    note: "公式:γo = 0.1820·f·(Σ Si·Fi + N″D),原文 Annex 1 §1 式 (1)–(9),Table 1 的 44 条氧气谱线,图 1 的海平面干大气(1013.25 hPa、15 °C、水汽 0)逐线求和;由 spec_sources 算(itu_p676.gamma_o_dry_sea_level),本库用 Python 包 itur 0.4.0 独立复算一致。只算氧气(干空气),不含水汽:本库的 channel.oxygen_db_per_km 就是氧气。 77.5 GHz(77 GHz 档的中心)处的值。**更正(0.2.11)**:0.2.10 及以前记 0.4(survey,转述),那接近氧气加水汽的总气体衰减(标准大气,水汽 7.5 g/m³:约 0.34 dB/km,水汽 0.25 占大头),不是氧气。水汽不在本库的信道里;25 m 目标往返多出约 0.01 dB。"

  # ---------------------------------------------------------------- 目标 RCS 典型值(survey)
  rcs.human_dbsm:
    value: -10.0
    unit: dBsm
    source: spec
    upstream: "spec_sources:target_rcs.deep2019_pedestrian_77g#co_pol_min_dbsm"
    cite: "Y. Deep, P. Held, S. S. Ram, D. Steinhauser, A. Gupta, F. Gruson, A. Koch, A. Roy, 'Polarimetric Radar Cross-Sections of Pedestrians at Automotive Radar Frequencies', arXiv:1910.13706v1, 2019; read in the original by spec_sources (2026-11-13)"
    section: "III.B Results from electromagnetic ray tracing; Fig. 4"
    quote: "The figure shows that the co-polarization (σvv and σhh) components range from -10 dBsm to +5 dBsm. The cross-polarization components are generally weaker by approximately 10 dB."
    note: "取同极化范围的下端。**是射线追踪仿真,不是实测**:一名受试者行走一个步态的 69 帧,77 GHz,入射方位角 0° / 45° / 90°;本库 60 GHz 档也用它。0.2.10 及以前是同一个数,标 survey(转述,没读原文)。对 SNR 是 1 dB 对 1 dB:取上端 +5 dBsm 会多 15 dB。"
  rcs.car_dbsm:
    value: 10.0
    unit: dBsm
    source: derived
    upstream: "spec_sources:target_rcs.iso19206_3_car_rear_far_lower_dbsm"
    cite: "ISO 19206-3:2021's RCS band for a passenger car approached from the rear, as quoted in R. Zeits et al., 'Passenger Vehicle Surrogate Test Target Radar Return Repeatability', NHTSA DOT HS 813 648, Jan. 2025 (Tables 8-9; ISO itself not read); read in the original by spec_sources (2026-11-14)"
    note: "公式:P_FAR − ΔP = 20 − 10 = 10 dBsm,即 ISO 19206-3 给乘用车车尾、40 m 以外那条 RCS 带的下界(带子中心 20 dBsm,76–77 GHz 雷达)。为什么取下界不取中心:近距离时 ISO 的中心按 20 − 0.013·(D − 40 m)² 往下降,15 / 10 / 5.3 m 处约 11.9 / 8.3 / 4.3 dBsm,本库的场景都在 15 m 以内,10 dBsm 比 20 更近;但本库的 RCS 不随距离变(ROADMAP)。只是车尾一个视角;侧面(90°)30 m 处是 13–30 dBsm。用在 60 GHz 档是外推,与行人 RCS 同。0.2.12 及以前标 survey(转述,未读原文),数相同。"
  rcs.corner_reflector_dbsm:
    value: 20.0
    unit: dBsm
    source: assumed
    cite: "this library's choice of test target: a triangular trihedral of 15.6 cm interior edge at 60 GHz (13.8 cm at 77 GHz), peak RCS by A. W. Doerry, 'Reflectors for SAR Performance Testing', Sandia SAND2008-0396, 2008, eq. (1): sigma = 4 pi a^4 / (3 lambda^2) (spec_sources:target_rcs.trihedral_peak, read in the original 2026-11-14)"
    note: "占位(反射器的大小与形状是用的人定的,原文只给公式):60 GHz、a = 15.6 cm 时 4πa⁴/(3λ²) = 100 m² = 20.0 dBsm,峰值方向与每块板成 35.26°。两个频段共用这一个数:同一个反射器到 77 GHz 多 20 lg(77/60) = 2.17 dB,所以 77 GHz 档的 20 dBsm 对应 13.8 cm 的反射器。**更正(0.2.13)**:原 cite 写'约 10 cm 边、60 GHz,σ ~ 10² m²',按同一个公式 10 cm 只有 16.8 m² = 12.2 dBsm(方形 21.8);数保持 20 dBsm,改的是尺寸(fmcw_radar#19)。"

  # ---------------------------------------------------------------- 窗函数主瓣宽度(survey,Harris 1978 表)
  window.rect_3db_bins:
    value: 0.89
    unit: bins
    source: spec
    upstream: "spec_sources:harris1978.rect#bw_3db_bins"
