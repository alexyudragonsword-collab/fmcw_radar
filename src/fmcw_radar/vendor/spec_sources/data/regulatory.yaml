    section: "§15.255 节标题；(c) Radiated power limits 首句"
    quote: "§ 15.255 Operation within the band 57-71 GHz. [...] (c) Radiated power limits. Within the 57-71 GHz band, emission levels shall not exceed the following equivalent isotropically radiated power (EIRP):"
    note: "57–71 GHz 的上边。频段写在节标题与 (c) 首句；迁入时 cite 写的 '(a)' 在现行条文里是'卫星上的设备不适用本节'，出处已改正。"

  fcc15255.radar_default:
    value: {band_low_hz: 57.0e+9, band_high_hz: 71.0e+9, peak_eirp_dbm: 10.0, peak_conducted_dbm: -10.0}
    unit: "Hz, Hz, dBm, dBm"
    source: spec
    cite: "47 CFR §15.255 'Operation within the band 57-71 GHz'，eCFR（www.ecfr.gov，美国政府公开文本）2026-11-16 版的现行条文（该节最近一次修订 2023-08-23，与本库 2026-11-16 读的 2026-11-12 版逐字节相同）；2026-11-18 读原文"
    section: "§15.255(c) 首句；(c)(2) 首句"
    quote: "§ 15.255 Operation within the band 57-71 GHz. [...] (c) Radiated power limits. Within the 57-71 GHz band, emission levels shall not exceed the following equivalent isotropically radiated power (EIRP): [...] (2) Field disturbance sensors/radars shall not exceed −10 dBm peak conducted output power and 10 dBm peak EIRP except that field disturbance sensors/radars that limit their operation to all or part of the specified frequency band may operate without being subject to a transmitter conducted output power limit if they operate in compliance with paragraph (b)(3) of this section or with one or more of the provisions below:"
    note: "雷达类器件（原文 field disturbance sensors/radars）在 57–71 GHz 的默认上限：峰值 EIRP 10 dBm，**且**峰值传导输出功率 −10 dBm。只有把工作频率限制在下列某一档的频段之内（all or part of the specified frequency band）、并满足那一档的条件时，才改按那一档，且不再受传导功率限制：fcc15255.radar_57_59p4_indoor / _outdoor、radar_57_61p56 / _off_time、radar_57_64 / _outdoor、radar_61_61p5、radar_uav_60_64。可在 (c)(2) 的几档之间切换，但同一时刻只能在一档，每档至少停 33 ms（fcc15255.radar_mode_switch）。"

  fcc15255.radar_57_59p4_indoor:
    value: {band_low_hz: 57.0e+9, band_high_hz: 59.4e+9, peak_eirp_dbm: 20.0}
    unit: "Hz, Hz, dBm"
    source: spec
    cite: "47 CFR §15.255 'Operation within the band 57-71 GHz'，eCFR（www.ecfr.gov，美国政府公开文本）2026-11-16 版的现行条文（该节最近一次修订 2023-08-23，与本库 2026-11-16 读的 2026-11-12 版逐字节相同）；2026-11-18 读原文"
    section: "§15.255(c)(2)(i)"
    quote: "(c) Radiated power limits. Within the 57-71 GHz band, emission levels shall not exceed the following equivalent isotropically radiated power (EIRP): [...] (2) Field disturbance sensors/radars shall not exceed −10 dBm peak conducted output power and 10 dBm peak EIRP except that field disturbance sensors/radars that limit their operation to all or part of the specified frequency band may operate without being subject to a transmitter conducted output power limit if they operate in compliance with paragraph (b)(3) of this section or with one or more of the provisions below: (i) 57.0-59.4 GHz: the peak EIRP level shall not exceed 20 dBm for indoor operation or 30 dBm for outdoor operation;"
    note: "工作频率限制在 57.0–59.4 GHz 之内、在室内使用的雷达：峰值 EIRP ≤ 20 dBm，没有关断时间要求。'室内'在 §15.255 与 §15.3（定义）里都没有定义，原文没有。这一档原文明写不受发射机传导功率限制（(c)(2) 首句），所以没有传导功率字段。可在 (c)(2) 的几档之间切换，但同一时刻只能在一档，每档至少停 33 ms（fcc15255.radar_mode_switch）。"

  fcc15255.radar_57_59p4_outdoor:
