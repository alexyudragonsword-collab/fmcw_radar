    section: "§15.255(c)(2)(v)"
    quote: "(c) Radiated power limits. Within the 57-71 GHz band, emission levels shall not exceed the following equivalent isotropically radiated power (EIRP): [...] (2) Field disturbance sensors/radars shall not exceed −10 dBm peak conducted output power and 10 dBm peak EIRP except that field disturbance sensors/radars that limit their operation to all or part of the specified frequency band may operate without being subject to a transmitter conducted output power limit if they operate in compliance with paragraph (b)(3) of this section or with one or more of the provisions below: [...] (v) 61.0-61.5 GHz: For field disturbance sensors/radars that occupy 500 MHz bandwidth or less that are contained wholly within the frequency band 61.0-61.5 GHz, the average power of any emission, measured during the transmit interval, shall not exceed 40 dBm, and the peak power of any emission shall not exceed 43 dBm. In addition, the average power of any emission outside of the 61.0-61.5 GHz band, measured during the transmit interval, but still within the 57-71 GHz band, shall not exceed 10 dBm, and the peak power of any emission shall not exceed 13 dBm."
