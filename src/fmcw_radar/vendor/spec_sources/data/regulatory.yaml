    unit: "Hz, Hz, dBm, s, s, s"
    source: spec
    cite: "47 CFR §15.255 'Operation within the band 57-71 GHz'，eCFR（www.ecfr.gov，美国政府公开文本）2026-11-16 版的现行条文（该节最近一次修订 2023-08-23，与本库 2026-11-16 读的 2026-11-12 版逐字节相同）；2026-11-18 读原文"
    section: "§15.255(c)(2)(iii)(B)"
    quote: "(c) Radiated power limits. Within the 57-71 GHz band, emission levels shall not exceed the following equivalent isotropically radiated power (EIRP): [...] (2) Field disturbance sensors/radars shall not exceed −10 dBm peak conducted output power and 10 dBm peak EIRP except that field disturbance sensors/radars that limit their operation to all or part of the specified frequency band may operate without being subject to a transmitter conducted output power limit if they operate in compliance with paragraph (b)(3) of this section or with one or more of the provisions below: [...] (iii) 57.0-64.0 GHz: [...] (B) The peak EIRP shall not exceed 20 dBm, and the sum of continuous transmitter off-times of at least two milliseconds shall equal at least 16.5 milliseconds within any contiguous interval of 33 milliseconds when operated outdoors: (1) As part of a temporary or permanently fixed application; or (2) When being used in vehicular applications to perform specific tasks of moving something or someone, except for in-cabin applications;"
    note: "工作频率限制在 57.0–64.0 GHz 之内、**在室外**使用、且属于下列之一的雷达：(1) 临时或永久固定的应用；(2) 车载应用中'执行移动某物或某人的特定任务'，车厢内的应用除外。峰值 EIRP ≤ 20 dBm，关断合计 ≥ 16.5 ms。关断时间按原文是：任意连续 33 ms 的窗口里，每段至少连续 2 ms 的关断加起来不少于下限；短于 2 ms 的空闲（例如 chirp 之间的回扫）不计入。'室外'、'固定'、'车载'在 §15.255 与 §15.3 里都没有进一步定义，原文没有。这一档原文明写不受发射机传导功率限制（(c)(2) 首句），所以没有传导功率字段。可在 (c)(2) 的几档之间切换，但同一时刻只能在一档，每档至少停 33 ms（fcc15255.radar_mode_switch）。"

  fcc15255.radar_61_61p5:
    value: {band_low_hz: 61.0e+9, band_high_hz: 61.5e+9, max_bandwidth_hz: 500.0e+6, avg_eirp_dbm: 40.0, peak_eirp_dbm: 43.0, outside_avg_eirp_dbm: 10.0, outside_peak_eirp_dbm: 13.0}
    unit: "Hz, Hz, Hz, dBm, dBm, dBm, dBm"
    source: spec
    cite: "47 CFR §15.255 'Operation within the band 57-71 GHz'，eCFR（www.ecfr.gov，美国政府公开文本）2026-11-16 版的现行条文（该节最近一次修订 2023-08-23，与本库 2026-11-16 读的 2026-11-12 版逐字节相同）；2026-11-18 读原文"
    section: "§15.255(c)(2)(v)"
    quote: "(c) Radiated power limits. Within the 57-71 GHz band, emission levels shall not exceed the following equivalent isotropically radiated power (EIRP): [...] (2) Field disturbance sensors/radars shall not exceed −10 dBm peak conducted output power and 10 dBm peak EIRP except that field disturbance sensors/radars that limit their operation to all or part of the specified frequency band may operate without being subject to a transmitter conducted output power limit if they operate in compliance with paragraph (b)(3) of this section or with one or more of the provisions below: [...] (v) 61.0-61.5 GHz: For field disturbance sensors/radars that occupy 500 MHz bandwidth or less that are contained wholly within the frequency band 61.0-61.5 GHz, the average power of any emission, measured during the transmit interval, shall not exceed 40 dBm, and the peak power of any emission shall not exceed 43 dBm. In addition, the average power of any emission outside of the 61.0-61.5 GHz band, measured during the transmit interval, but still within the 57-71 GHz band, shall not exceed 10 dBm, and the peak power of any emission shall not exceed 13 dBm."
    note: "占用带宽 ≤ 500 MHz 且整个落在 61.0–61.5 GHz 之内的雷达：带内平均 EIRP ≤ 40 dBm、峰值 ≤ 43 dBm（发射期间测量）；同时 61.0–61.5 GHz 之外、57–71 GHz 之内的发射平均 ≤ 10 dBm、峰值 ≤ 13 dBm（outside_*）。这是 (c)(2) 里唯一同时给平均与峰值的一档，也没有关断时间要求。'占用带宽'怎么量，这一款没有写，原文没有；FCC 23-35 第 62 段要求在合规测量里按 §2.1049 实测占用带宽，第 22 段讲这一档时也用 occupied bandwidth，但这些不在条文里（fcc15255.radar_occupied_bandwidth、fcc2.occupied_bandwidth）。这一档原文明写不受发射机传导功率限制（(c)(2) 首句），所以没有传导功率字段。可在 (c)(2) 的几档之间切换，但同一时刻只能在一档，每档至少停 33 ms（fcc15255.radar_mode_switch）。"

  fcc15255.radar_uav_60_64:
    value: {band_low_hz: 60.0e+9, band_high_hz: 64.0e+9, peak_eirp_dbm: 20.0, off_time_sum_min_s: 0.0165, off_time_window_s: 0.033, off_time_min_run_s: 0.002, max_height_agl_m: 121.92}
    unit: "Hz, Hz, dBm, s, s, s, m"
    source: spec
    cite: "47 CFR §15.255 'Operation within the band 57-71 GHz'，eCFR（www.ecfr.gov，美国政府公开文本）2026-11-16 版的现行条文（该节最近一次修订 2023-08-23，与本库 2026-11-16 读的 2026-11-12 版逐字节相同）；2026-11-18 读原文"
    section: "§15.255(b)(3)；(c)(2) 首句"
    quote: "(3) Field disturbance sensors/radar devices deployed on unmanned aircraft may operate within the frequency band 60-64 GHz, provided that the transmitter not exceed 20 dBm peak EIRP. The sum of continuous transmitter off-times of at least two milliseconds shall equal at least 16.5 milliseconds within any contiguous interval of 33 milliseconds. Operation shall be limited to a maximum of 121.92 meters (400 feet) above ground level. [...] (c) Radiated power limits. Within the 57-71 GHz band, emission levels shall not exceed the following equivalent isotropically radiated power (EIRP): [...] (2) Field disturbance sensors/radars shall not exceed −10 dBm peak conducted output power and 10 dBm peak EIRP except that field disturbance sensors/radars that limit their operation to all or part of the specified frequency band may operate without being subject to a transmitter conducted output power limit if they operate in compliance with paragraph (b)(3) of this section or with one or more of the provisions below:"
    note: "装在无人机上的雷达：工作频率限制在 60–64 GHz 之内，峰值 EIRP ≤ 20 dBm，关断合计 ≥ 16.5 ms，离地不超过 121.92 m（400 ft）。(c)(2) 首句把它列为可选的一档。关断时间按原文是：任意连续 33 ms 的窗口里，每段至少连续 2 ms 的关断加起来不少于下限；短于 2 ms 的空闲（例如 chirp 之间的回扫）不计入。这一档原文明写不受发射机传导功率限制（(c)(2) 首句），所以没有传导功率字段。相关的还有 (b)(2)(iii)：飞行中的飞机上，雷达只能装在乘客的便携电子设备里、只用 59.3–71.0 GHz（本库没有为它建条目）。"

  fcc15255.radar_mode_switch:
    value: {modes_at_once: 1, min_dwell_s: 0.033}
    unit: "-, s"
    source: spec
    cite: "47 CFR §15.255 'Operation within the band 57-71 GHz'，eCFR（www.ecfr.gov，美国政府公开文本）2026-11-16 版的现行条文（该节最近一次修订 2023-08-23，与本库 2026-11-16 读的 2026-11-12 版逐字节相同）；2026-11-18 读原文"
    section: "§15.255(c)(2)(iv)"
    quote: "(c) Radiated power limits. Within the 57-71 GHz band, emission levels shall not exceed the following equivalent isotropically radiated power (EIRP): [...] (2) Field disturbance sensors/radars shall not exceed −10 dBm peak conducted output power and 10 dBm peak EIRP except that field disturbance sensors/radars that limit their operation to all or part of the specified frequency band may operate without being subject to a transmitter conducted output power limit if they operate in compliance with paragraph (b)(3) of this section or with one or more of the provisions below: [...] (iv) A field disturbance sensor may operate in any of the modes in the above sub-sections so long as the device operates in only one mode at any time and does so for at least 33 milliseconds before switching to another mode."
    note: "一部雷达同时满足几档时：可以用其中任意一档，原文没有优先顺序；但同一时刻只能在一档，换档前在当前档至少停 33 ms。"

  fcc15255.radar_occupied_bandwidth:
    value: {quantity: "occupied bandwidth (47 CFR 2.1049)", measured: "as part of the compliance measurements", required_by: "47 CFR 15.201(b)", sweep_during_measurement: "normal: any related frequency sweep, step, or hop function activated", codified: "only the sweep condition (15.255(i)(2); 15.31(c) excepts 15.255); the occupied-bandwidth sentence is in R&O para. 62, not in the rule text"}
    unit: "-"
    source: spec
    cite: "FCC 23-35, Report and Order 'Amendment of Section 15.255 of the Commission’s Rules', ET Docket No. 21-264（2023-05-18 通过，2023-05-19 发布；docs.fcc.gov/public/attachments/FCC-23-35A1.pdf，FCC 公开文件，2026-11-25 读原件）；47 CFR §15.255、§15.31，eCFR（www.ecfr.gov，美国政府公开文本）2026-11-20 版的现行条文；2026-11-26 读原文"
    section: "FCC 23-35 ¶61, ¶62, fn 160, 163, 167, ¶22；47 CFR §15.255(c)(2)(v), (f), (i)(2)；§15.31(c)"
    quote: "(FCC 23-35 ¶61) Valeo suggests that transmission bandwidth should be expressed as a measured occupied bandwidth. If the transmission bandwidth would be specified only by the chirp specification, it could happen that a chirp timing constraint (e.g., maximum chirp slope) may occur. Valeo suggests that the occupied bandwidth be measured, including the overshoots caused by the slew rate of the chirp and the return ramp. (¶62) We find that exempting FMCW and other swept-frequency radars from section 15.31(c) is necessary for performing meaningful compliance measurements. [...] With respect to transmission bandwidth, we agree with Valeo that the occupied bandwidth be measured as part of the compliance measurements. Doing so will ensure fidelity to the requirements specified in section 2.1049 as required by section 15.201(b). [...] The higher power limits provided to 60 GHz radar will permit the measurement of occupied bandwidth, even in a radiated measurement, with adequate [...] sensitivity. (fn 163) An FMCW radar transmitter develops its emission bandwidth by sweeping over a defined set of frequencies. In order to measure the associated bandwidth, the device must sweep normally. If the sweep is stopped, then the measured bandwidth will be that of the continuous wave (CW) signal, which is theoretically zero. (fn 167) 47 CFR §§ 2.1049 and 15.201(b). (¶22) Under this rule, a fixed FDS device’s occupied bandwidth must be fully contained within the 500-megahertz bandwidth of the 61.0-61.5 GHz band (47 CFR §15.255) (v) 61.0-61.5 GHz: For field disturbance sensors/radars that occupy 500 MHz bandwidth or less that are contained wholly within the frequency band 61.0-61.5 GHz [...] (f) Frequency stability. Fundamental emissions must be contained within the frequency bands specified in this section during all conditions of operation. [...] (i) Compliance measurement. Measurement procedures that have been found to be acceptable to the Commission in accordance with § 2.947 of this chapter may be used to demonstrate compliance. [...] (2) Compliance measurements of frequency-agile field disturbance sensors/radars shall be performed with any related frequency sweep, step, or hop function activated. (§15.31) (c) Except as otherwise indicated in §§ 15.255 and 15.256, for swept frequency equipment, measurements shall be made with the frequency sweep stopped at those frequencies chosen for the measurements to be reported."
    note: "FCC 23-35 第 62 段：雷达的 transmission bandwidth 按占用带宽在合规测量里实测，口径是 §2.1049（每侧 0.5 % 平均功率，fcc2.occupied_bandwidth），理由是 §15.201(b)（脚注 167）；它同意的是第 61 段 Valeo 的意见，那里写明含 chirp 的过冲与回扫。**效力**：附录 B（Final Rules）改了 §15.31(c)、§15.35(c) 与 §15.255，占用带宽这一句没有写进条文——附录 B 与现行 §15.255 里都没有 'occupied bandwidth'、§2.1049、§15.201（codified）。写进条文的只有扫频开着测：§15.255(i)(2)，以及 §15.31(c)'扫频停下来测'对 §15.255 的例外。所以这是委员会在 R&O 正文里的说法；§2.1041(a) 另说 Part 15 设备的测量方法由该设备的条文规定（fcc2.occupied_bandwidth 的 quote）。**判档**：(c)(2) 各档的条件是 'limit their operation to all or part of the specified frequency band'，R&O 没有说判'在不在档内'用什么带宽，原文没有。(f) 要求基波在所有工况（−20 至 +50 °C，额定电压的 85–115 %）下都留在 §15.255 规定的频段内；R&O 全文没有讨论 (f)（没有 'fundamental emission'、'frequency stability' 字样），(f) 也没有定义带宽口径，原文没有。**61.0–61.5 GHz 档**：(c)(2)(v) 的 'occupy 500 MHz bandwidth or less' 在 §15.255 里没有定义；R&O 第 22 段讲这一档（当时的旧条文）时写作'occupied bandwidth must be fully contained within the 500-megahertz bandwidth'，第 9 段同样用 occupied bandwidth，两处都没有引 §2.1049。§15.255 自己定义的带宽只有两种，都不是这一档的：(c)(3) 脉冲雷达的 radar bandwidth（比最高发射低 10 dB 的两点）与 (e)(2) 非雷达设备的 emission bandwidth（−6 dB，100 kHz RBW）。**测量条件**：除了扫频正常进行（脚注 163、§15.255(i)(2)），R&O、§15.255、§2.1049 都没有说占用带宽用什么检波、怎么平均、是否只在发射期间测，原文没有；'measured during the transmit interval' 只出现在 (c)(1) 与 (c)(2)(v) 的功率限值里。§15.31(a)(3) 指定的测量规程 ANSI C63.10-2020 不是公开文本，本库没读。第 61 段 Auto Innovators 提的'至少 5 个重复周期'，第 62 段没有回应。fmcw_radar#46 请求建这一条。"

  fcc2.occupied_bandwidth:
    value: {power_outside_each_limit_pct: 0.5}
    unit: "% of the total mean power, each side"
    source: spec
    cite: "47 CFR §2.202、§2.1049、§2.1041，eCFR（www.ecfr.gov，美国政府公开文本）2026-11-20 版的现行条文；2026-11-26 读原文"
    section: "§2.202(a) Occupied bandwidth；§2.1049 Measurements required: Occupied bandwidth, (h), (i)；§2.1041 Measurement procedure"
    quote: "(§2.202(a)) Occupied bandwidth. The frequency bandwidth such that, below its lower and above its upper frequency limits, the mean powers radiated are each equal to 0.5 percent of the total mean power radiated by a given emission. In some cases, for example multichannel frequency-division systems, the percentage of 0.5 percent may lead to certain difficulties in the practical application of the definitions of occupied and necessary bandwidth; in such cases a different percentage may prove useful. (§2.1049) The occupied bandwidth, that is the frequency bandwidth such that, below its lower and above its upper frequency limits, the mean powers radiated are each equal to 0.5 percent of the total mean power radiated by a given emission shall be measured under the following conditions as applicable [...] (h) Transmitters employing digital modulation techniques—when modulated by an input signal such that its amplitude and symbol rate represent the maximum rated conditions under which the equipment will be operated. [...] (i) Transmitters designed for other types of modulation—when modulated by an appropriate signal of sufficient amplitude to be representative of the type of service in which used. A description of the input signal should be supplied. (§2.1041) (a) For equipment operating under parts 15 and 18, the measurement procedures are specified in the rules governing the particular device for which certification is requested. (b) For equipment operating in the authorized radio services, measurements are required as specified in §§ 2.1046, 2.1047, 2.1049, 2.1051, 2.1053, 2.1055 and 2.1057."
    note: "占用带宽的定义：上限以上、下限以下的平均功率各占该发射总平均功率的 0.5 %（power_outside_each_limit_pct）。§2.202(a) 是定义，§2.1049 是认证时要测的量，两处同一句；§2.202(a) 还说多路频分系统等情况下 0.5 % 可能不便，可改用别的百分比。§2.1049 列的测试信号条件里，(h) 是数字调制，(i) 是'其他调制'：用足以代表其业务的信号调制，并说明输入信号；没有检波方式与平均时间。§2.1041：Part 15、18 设备的测量方法由该设备的条文规定，(b) 对授权业务列出 §2.1049 等。60 GHz 雷达是经 FCC 23-35 第 62 段与 §15.201(b) 引到这里的（fcc15255.radar_occupied_bandwidth）。fmcw_radar#46 请求建这一条。"
