# Vendored from spec_sources@98b1d1b33d091ccd3133775610ced59e8bf72c16: src/spec_sources/data/regulatory.yaml
# Adapted-copy policy: see src/fmcw_radar/vendor/__init__.py
# regulatory —— 频谱规管条文（47 CFR §15.255 等）。
#
# 标签：spec（对过原文，带 quote 与 section）/ survey（未核实，note 写明）/ derived（只由本库的 spec、
# survey 条目推出，note 或 cite 是公式）。本表不收 assumed：哪个库自己的取舍留在那个库的本地表。
# 只有条目自己的标签行写成"标签词 + 冒号"，说明文字里不写，所以对四个标签各跑一次 grep -c
# 都恰好等于该标签的条目数（tests/test_iron_rules.py 跑真的 grep）。
#
# 出处：条目从 mmw60_trx@13024e0b012923071d827cc557b0da5eb9a9b2aa src/mmw60/data/spec/survey.yaml
# 逐字迁入，每个字段与源表相等（tests/test_extraction.py 对 tests/fixtures/ 里的副本逐条比）。
# 所以 cite / note 里的"本库"指 mmw60_trx，cairn/…、examples/…、tests/…、config.…、frontend.… 是它仓库里的路径，
# assumed.* 是它本地表里的条目；这些写法在条目下一次因核实而改动时改成明确的库名（ROADMAP）。
#
# 前缀：fcc15255.*。
#
# 2026-11-16 读了 eCFR 的现行条文（第 7 批），4 条都改成 spec，值不变。
# 2026-11-18 按 fmcw_radar 的请求（#50）为 (c)(2) 的雷达各档建了 10 条（fcc15255.radar_*），条文与 2026-11-16 读的逐字节相同。
# 键名里的 p 是小数点：radar_57_59p4 = 57.0–59.4 GHz。

entries:

  # ------------------------------------------------------------ 47 CFR §15.255：57–71 GHz 的频段与 EIRP 限值
  fcc15255.eirp_avg_dbm:
    value: 40.0
    unit: dBm
    source: spec
    cite: "47 CFR §15.255 'Operation within the band 57-71 GHz'，eCFR（www.ecfr.gov，美国政府公开文本）2026-11-12 版的现行条文（该节最近一次修订 2023-08-23）；2026-11-16 读原文"
    section: "§15.255(c)(1)(i)"
    quote: "(c) Radiated power limits. Within the 57-71 GHz band, emission levels shall not exceed the following equivalent isotropically radiated power (EIRP): (1) Devices other than field disturbance sensors shall comply with one of the following power limits, as measured during the transmit interval: (i) The average power of any emission shall not exceed 40 dBm and the peak power of any emission shall not exceed 43 dBm; or (ii) For fixed point-to-point transmitters located outdoors, the average power of any emission shall not exceed 82 dBm, and shall be reduced by 2 dB for every dB that the antenna gain is less than 51 dBi."
    note: "雷达以外器件的平均 EIRP 上限（发射期间测量），(c)(1)(i)；室外固定点对点按 (c)(1)(ii) 可到 82 dBm（天线增益低于 51 dBi 时每 dB 降 2 dB）。雷达类器件（field disturbance sensors/radars）不按这一款，按 (c)(2)：默认峰值 EIRP 10 dBm、峰值传导 −10 dBm，各档见 fcc15255.radar_* 条目。"

  fcc15255.eirp_peak_dbm:
    value: 43.0
    unit: dBm
    source: spec
    cite: "47 CFR §15.255 'Operation within the band 57-71 GHz'，eCFR（www.ecfr.gov，美国政府公开文本）2026-11-12 版的现行条文（该节最近一次修订 2023-08-23）；2026-11-16 读原文"
    section: "§15.255(c)(1)(i)"
    quote: "(c) Radiated power limits. Within the 57-71 GHz band, emission levels shall not exceed the following equivalent isotropically radiated power (EIRP): (1) Devices other than field disturbance sensors shall comply with one of the following power limits, as measured during the transmit interval: (i) The average power of any emission shall not exceed 40 dBm and the peak power of any emission shall not exceed 43 dBm; or (ii) For fixed point-to-point transmitters located outdoors, the average power of any emission shall not exceed 82 dBm, and shall be reduced by 2 dB for every dB that the antenna gain is less than 51 dBi."
    note: "雷达以外器件的峰值 EIRP 上限，(c)(1)(i)；与平均值 40 dBm（fcc15255.eirp_avg_dbm）同一句。"

