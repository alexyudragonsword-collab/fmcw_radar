    cite: "47 CFR §15.255 'Operation within the band 57-71 GHz'，eCFR（www.ecfr.gov，美国政府公开文本）2026-11-16 版的现行条文（该节最近一次修订 2023-08-23，与本库 2026-11-16 读的 2026-11-12 版逐字节相同）；2026-11-18 读原文"
    section: "§15.255(c)(2)(iii)(A)"
    quote: "(c) Radiated power limits. Within the 57-71 GHz band, emission levels shall not exceed the following equivalent isotropically radiated power (EIRP): [...] (2) Field disturbance sensors/radars shall not exceed −10 dBm peak conducted output power and 10 dBm peak EIRP except that field disturbance sensors/radars that limit their operation to all or part of the specified frequency band may operate without being subject to a transmitter conducted output power limit if they operate in compliance with paragraph (b)(3) of this section or with one or more of the provisions below: [...] (iii) 57.0-64.0 GHz: (A) The peak EIRP shall not exceed 14 dBm, and the sum of continuous transmitter off-times of at least two milliseconds shall equal at least 25.5 milliseconds within any contiguous interval of 33 milliseconds, except as specific in paragraph (c)(2)(iii)(B) of this section;"
    note: "工作频率限制在 57.0–64.0 GHz 之内的雷达（(B) 的室外固定 / 车载情形除外，见 fcc15255.radar_57_64_outdoor）：峰值 EIRP ≤ 14 dBm，**并且必须**满足关断时间（这一档没有'不满足关断时可用较低功率'的分支）。关断时间按原文是：任意连续 33 ms 的窗口里，每段至少连续 2 ms 的关断加起来不少于下限；短于 2 ms 的空闲（例如 chirp 之间的回扫）不计入。这一档关断合计 ≥ 25.5 ms，即发射占比 ≤ 7.5 / 33 = 22.7 %。这一档原文明写不受发射机传导功率限制（(c)(2) 首句），所以没有传导功率字段。可在 (c)(2) 的几档之间切换，但同一时刻只能在一档，每档至少停 33 ms（fcc15255.radar_mode_switch）。"

